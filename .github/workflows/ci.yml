  tools:
    name: Rust — tools (rocket-sdk + rocket-cmd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
