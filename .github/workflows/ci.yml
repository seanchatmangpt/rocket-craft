    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asset-pipeline

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  nuxt-shell:
    name: Nuxt — unit tests + type-check (mock mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-shell

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nuxt-shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (no server needed)
        run: npm run test:unit

      - name: Mock-mode loop contracts (MOCK_API=1, no Supabase needed)
        run: npm run test:loop:mock
        env:
          MOCK_API: "1"

  pm4py-conformance:
    name: Python — pm4py conformance smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pm4py
        run: pip install pm4py

      - name: Generate synthetic OCEL 2.0 fixture
        run: |
          python3 - <<'EOF'
          import json, pathlib
          # Minimal OCEL 2.0 JSON for smoke-test (no Supabase needed)
          # objectId MUST equal --session-id (ci-smoke) so the session filter keeps the
          # events — otherwise they're filtered out and conformance is vacuous.
          ocel = {
            "ocel:global-log": {"ocel:version": "2.0", "ocel:ordering": "timestamp"},
            "ocel:global-event": {"ocel:activity": "__INVALID__"},
            "ocel:global-object": {"ocel:type": "session"},
            "ocel:events": {
              "e1": {"ocel:activity": "GameSessionStarted", "ocel:timestamp": "2026-06-19T00:00:01Z", "ocel:omap": ["ci-smoke"], "ocel:vmap": {}},
              "e2": {"ocel:activity": "FrameRendered",      "ocel:timestamp": "2026-06-19T00:00:02Z", "ocel:omap": ["ci-smoke"], "ocel:vmap": {}},
              "e3": {"ocel:activity": "InputAdmitted",      "ocel:timestamp": "2026-06-19T00:00:03Z", "ocel:omap": ["ci-smoke"], "ocel:vmap": {}},
            },
            "ocel:objects": {
              "ci-smoke": {"ocel:type": "session", "ocel:ovmap": {}}
            },
            "events": [
              {"id":"e1","type":"GameSessionStarted","time":"2026-06-19T00:00:01Z","attributes":{},"relationships":[{"objectId":"ci-smoke","qualifier":"session"}]},
              {"id":"e2","type":"FrameRendered","time":"2026-06-19T00:00:02Z","attributes":{},"relationships":[{"objectId":"ci-smoke","qualifier":"session"}]},
              {"id":"e3","type":"InputAdmitted","time":"2026-06-19T00:00:03Z","attributes":{},"relationships":[{"objectId":"ci-smoke","qualifier":"session"}]},
            ],
            "objects": [{"id":"ci-smoke","type":"session","attributes":[]}],
            "objectTypes": [{"name":"session","attributes":[]}],
            "eventTypes": [
              {"name":"GameSessionStarted","attributes":[]},
              {"name":"FrameRendered","attributes":[]},
              {"name":"InputAdmitted","attributes":[]},
            ],
          }
          out = pathlib.Path("/tmp/ci-smoke.ocel.json")
          out.write_text(json.dumps(ocel))
          print(f"Wrote {out}")
          EOF

      - name: Run pm4py conformance (smoke — synthetic session)
        run: python3 scripts/pm4py_conformance.py /tmp/ci-smoke.ocel.json --session-id ci-smoke --out /tmp/ci-fitness-report.json

      - name: Print fitness report
        run: cat /tmp/ci-fitness-report.json

  nuxt-shell-headless-loop:
    name: Nuxt — headless gameplay loop (Supabase local)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-shell

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nuxt-shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        timeout-minutes: 5

      - name: Apply migrations
        run: supabase migration up --local

      - name: Export Supabase local keys
        run: |
          ANON_KEY=$(supabase status --output json | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).anon_key))")
          SERVICE_KEY=$(supabase status --output json | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).service_role_key))")
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

      - name: Generate Ed25519 signing key + register active (exercises signed evidence-pack)
        run: |
          node --input-type=module -e "
            import * as ed from '@noble/ed25519';
            const b64 = u => Buffer.from(u).toString('base64');
            const priv = ed.utils.randomPrivateKey();
            const pub = await ed.getPublicKeyAsync(priv);
            process.stdout.write(b64(priv)+'\n'+b64(pub)+'\n');
          " > /tmp/kp.txt
          PRIV=$(sed -n 1p /tmp/kp.txt); PUB=$(sed -n 2p /tmp/kp.txt)
          # Register the public key as the active signing key so signing_key_id resolves.
          curl -s -X POST "http://localhost:54321/rest/v1/signing_keys" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"public_key_b64\":\"$PUB\",\"status\":\"active\"}"
          echo "ROCKET_SIGNING_KEY=$PRIV" >> $GITHUB_ENV
          echo "ROCKET_SIGNING_PUBKEY=$PUB" >> $GITHUB_ENV

      - name: Start Nitro dev server (background)
        run: |
          npx nuxt dev --port 3000 &
          timeout 90 bash -c 'until curl -sf http://localhost:3000/api/game/pipeline-health; do sleep 3; done'
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_SESSION_SEED: "1"
          ALLOW_ANON_GAME: "1"
          # With these set, evidence-pack signs pack_hash → headless Step 11 verifies
          # the signed path (not just graceful-null).
          ROCKET_SIGNING_KEY: ${{ env.ROCKET_SIGNING_KEY }}
          ROCKET_SIGNING_PUBKEY: ${{ env.ROCKET_SIGNING_PUBKEY }}
          NODE_ENV: development

      - name: Run headless gameplay loop (all steps, MOCK_API=0)
        run: npm run test:loop
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          API_BASE_URL: http://localhost:3000
          MOCK_API: "0"
          ALLOW_SESSION_SEED: "1"
          NODE_ENV: development

      - name: Real-OCEL conformance gate (mine the actual event log)
        run: |
          SID=$(curl -sf -X POST http://localhost:3000/api/game/session-seed \
            -H 'content-type: application/json' -d '{"create_test_player":true}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).session_id))")
          curl -sf "http://localhost:3000/api/game/ocel-export?session_id=$SID" -o /tmp/ci-loop-ocel.json
          # python3 is preinstalled on ubuntu-latest; pm4py is optional (script falls back).
          python3 scripts/pm4py_conformance.py /tmp/ci-loop-ocel.json --session-id "$SID" --out /tmp/ci-loop-fitness.json
          cat /tmp/ci-loop-fitness.json
        env:
          ALLOW_SESSION_SEED: "1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run fast Playwright E2E (control plane + real auth + OCEL loop)
        run: npx playwright test e2e/shell.spec.ts e2e/auth-flow.spec.ts e2e/game-loop.spec.ts --project=game-loop --workers=2
        env:
          # Default Playwright config baseURL is http://localhost:3000 (reuses the
          # running dev server). These specs don't need the UE4 asset server —
          # shell/game-loop block /manufactured/**, auth-flow is DOM-only.
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nuxt-shell/playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
